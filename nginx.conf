# nginx configuration for Azure Flask app
server {
    listen 8080;
    listen [::]:8080;
    root /home/site/wwwroot;
    server_name _;
    port_in_redirect off;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    charset utf-8;

    # Increase buffer sizes
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # Force HTTPS on Azure
    if ($http_x_arr_ssl = "") {
        return 301 https://$host$request_uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Static files
    location /static/ {
        alias /home/site/wwwroot/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Uploaded files (ECG & documents)
    location /uploads/ {
        alias /home/site/wwwroot/uploads/;
        expires 1h;
        add_header Cache-Control "private, must-revalidate";
    }

    # Favicon
    location = /favicon.ico { 
        access_log off; 
        log_not_found off; 
        try_files /static/favicon.ico =204;
    }
    
    location = /robots.txt  { 
        access_log off; 
        log_not_found off; 
        return 200 "User-agent: *\nDisallow: /\n";
        add_header Content-Type text/plain;
    }

    # Error pages for cold starts
    error_page 502 503 504 /warmup.html;
    
    location = /warmup.html {
        root /home/site/wwwroot/static;
        internal;
    }

    # Proxy all other requests to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Timeouts for AI processing
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
