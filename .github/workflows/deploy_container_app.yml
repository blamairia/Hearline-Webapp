name: Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: portfolio
  CONTAINER_APP_NAME: heartline-webapp
  CONTAINERAPPS_ENVIRONMENT: heartline-app-env
  AZURE_CONTAINER_REGISTRY: heartlineregistry
  IMAGE_NAME: heartline-webapp
  AZURE_LOCATION: germanywestcentral

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure Container Apps extension
        run: |
          az extension add --name containerapp --upgrade
          az provider register --namespace Microsoft.App --wait
          az provider register --namespace Microsoft.OperationalInsights --wait
          az provider register --namespace Microsoft.ContainerRegistry --wait

      - name: Resolve container registry
        id: acr-info
        run: |
          LOGIN_SERVER=$(az acr show --name $AZURE_CONTAINER_REGISTRY --query loginServer -o tsv)
          USERNAME=$(az acr credential show --name $AZURE_CONTAINER_REGISTRY --query username -o tsv)
          PASSWORD=$(az acr credential show --name $AZURE_CONTAINER_REGISTRY --query passwords[0].value -o tsv)
          echo "login_server=$LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "username=$USERNAME" >> $GITHUB_OUTPUT
          echo "password=$PASSWORD" >> $GITHUB_OUTPUT
          echo "ACR_LOGIN_SERVER=$LOGIN_SERVER" >> $GITHUB_ENV

      - name: Docker login
        run: |
          echo "${{ steps.acr-info.outputs.password }}" | docker login ${{ steps.acr-info.outputs.login_server }} \
            --username "${{ steps.acr-info.outputs.username }}" --password-stdin

      - name: Build container image
        run: |
          docker build \
            --file Dockerfile \
            --tag ${{ steps.acr-info.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push container image
        run: docker push ${{ steps.acr-info.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        run: |
          set -euo pipefail
          IMAGE="${{ steps.acr-info.outputs.login_server }}/$IMAGE_NAME:${{ github.sha }}"
          if az containerapp show --name $CONTAINER_APP_NAME --resource-group $AZURE_RESOURCE_GROUP >/dev/null 2>&1; then
            az containerapp update \
              --name $CONTAINER_APP_NAME \
              --resource-group $AZURE_RESOURCE_GROUP \
              --image "$IMAGE"
          else
            az containerapp create \
              --name $CONTAINER_APP_NAME \
              --resource-group $AZURE_RESOURCE_GROUP \
              --environment $CONTAINERAPPS_ENVIRONMENT \
              --image "$IMAGE" \
              --ingress external \
              --target-port 8000 \
              --min-replicas 1 \
              --max-replicas 1 \
              --registry-server ${{ steps.acr-info.outputs.login_server }} \
              --registry-username ${{ steps.acr-info.outputs.username }} \
              --registry-password ${{ steps.acr-info.outputs.password }} \
              --location $AZURE_LOCATION
          fi

      - name: Show deployed endpoint
        run: |
          FQDN=$(az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed endpoint: https://${FQDN}" | tee -a $GITHUB_STEP_SUMMARY
