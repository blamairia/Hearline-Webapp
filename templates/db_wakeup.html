<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Starting Up - Heartline Medical Clinic</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-color: #0074d9;
            --primary-gradient: linear-gradient(135deg, #0074d9 0%, #00b4ff 100%);
            --bg-color: #f8f9fa;
            --text-color: #1a1a2e;
            --text-muted: #6c757d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wakeup-container {
            text-align: center;
            padding: 3rem;
            max-width: 500px;
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-container img {
            width: 80px;
            height: auto;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.15);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.15);
            }

            56% {
                transform: scale(1);
            }
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 700;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 1rem;
        }

        .status-container {
            margin: 2rem 0;
        }

        .status-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }

        .status-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        /* ECG Line Animation */
        .ecg-container {
            width: 100%;
            height: 80px;
            margin: 2rem 0;
            position: relative;
            overflow: hidden;
        }

        .ecg-line {
            position: absolute;
            width: 200%;
            height: 100%;
            animation: ecg-scroll 3s linear infinite;
        }

        @keyframes ecg-scroll {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .ecg-line svg {
            width: 100%;
            height: 100%;
        }

        .ecg-line path {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Progress Dots */
        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 2rem 0;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ddd;
            animation: dot-pulse 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) {
            animation-delay: 0s;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot-pulse {

            0%,
            100% {
                background: #ddd;
                transform: scale(1);
            }

            50% {
                background: var(--primary-color);
                transform: scale(1.2);
            }
        }

        .info-text {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-top: 2rem;
        }

        .info-text i {
            color: var(--primary-color);
            margin-right: 0.5rem;
        }

        .retry-count {
            font-size: 0.75rem;
            color: #999;
            margin-top: 1rem;
        }

        /* Success state */
        .status-container.ready .status-title {
            color: #28a745;
        }

        .status-container.ready .ecg-line path {
            stroke: #28a745;
        }

        /* Error state after max retries */
        .status-container.error .status-title {
            color: #dc3545;
        }

        .retry-btn {
            display: none;
            margin-top: 1rem;
            padding: 0.75rem 2rem;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .retry-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 116, 217, 0.3);
        }

        .status-container.error .retry-btn {
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="wakeup-container">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='img/Heartline.png') }}" alt="Heartline Logo"
                onerror="this.style.display='none'">
        </div>

        <div class="brand-name">Heartline</div>

        <div class="status-container" id="statusContainer">
            <h1 class="status-title" id="statusTitle">
                <i class="fas fa-database me-2"></i>
                System Starting Up
            </h1>
            <p class="status-subtitle" id="statusSubtitle">
                Please wait while we prepare your experience...
            </p>

            <!-- ECG Animation -->
            <div class="ecg-container">
                <div class="ecg-line">
                    <svg viewBox="0 0 800 80" preserveAspectRatio="none">
                        <!-- First half of the pattern -->
                        <path
                            d="M0,40 L30,40 L35,40 L40,40 L50,40 L55,20 L60,60 L65,10 L70,70 L75,40 L80,40 L120,40 L125,40 L130,40 L140,40 L145,20 L150,60 L155,10 L160,70 L165,40 L170,40 L210,40 L215,40 L220,40 L230,40 L235,20 L240,60 L245,10 L250,70 L255,40 L260,40 L300,40 L305,40 L310,40 L320,40 L325,20 L330,60 L335,10 L340,70 L345,40 L350,40 L400,40" />
                        <!-- Second half (repeat) -->
                        <path
                            d="M400,40 L430,40 L435,40 L440,40 L450,40 L455,20 L460,60 L465,10 L470,70 L475,40 L480,40 L520,40 L525,40 L530,40 L540,40 L545,20 L550,60 L555,10 L560,70 L565,40 L570,40 L610,40 L615,40 L620,40 L630,40 L635,20 L640,60 L645,10 L650,70 L655,40 L660,40 L700,40 L705,40 L710,40 L720,40 L725,20 L730,60 L735,10 L740,70 L745,40 L750,40 L800,40" />
                    </svg>
                </div>
            </div>

            <div class="progress-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <button class="retry-btn" onclick="location.reload()">
                <i class="fas fa-redo me-2"></i>
                Try Again
            </button>
        </div>

        <p class="info-text">
            <i class="fas fa-info-circle"></i>
            The database is waking up from sleep mode. This usually takes 30-60 seconds.
        </p>

        <p class="retry-count" id="retryCount">Checking connection... (attempt 0)</p>
    </div>

    <script>
        const originalUrl = '{{ next_url | default("/", true) }}';
        let retryCount = 0;
        const maxRetries = 120; // 10 minutes max (5s intervals)

        async function checkDatabase() {
            retryCount++;
            document.getElementById('retryCount').textContent =
                `Checking connection... (attempt ${retryCount})`;

            try {
                const response = await fetch('/db-wakeup-check', {
                    method: 'GET',
                    headers: { 'Accept': 'application/json' }
                });

                const data = await response.json();

                if (data.status === 'ready') {
                    // Database is ready!
                    const container = document.getElementById('statusContainer');
                    container.classList.add('ready');
                    document.getElementById('statusTitle').innerHTML =
                        '<i class="fas fa-check-circle me-2"></i>System Ready!';
                    document.getElementById('statusSubtitle').textContent =
                        'Redirecting you now...';
                    document.getElementById('retryCount').textContent =
                        'Connection established!';

                    // Redirect after a brief moment
                    setTimeout(() => {
                        window.location.href = originalUrl;
                    }, 1000);
                    return;
                }

                // Not ready yet, keep polling
                if (retryCount < maxRetries) {
                    setTimeout(checkDatabase, 5000);
                } else {
                    // Max retries reached
                    showError();
                }
            } catch (error) {
                console.error('Check failed:', error);
                // Network error, keep trying
                if (retryCount < maxRetries) {
                    setTimeout(checkDatabase, 5000);
                } else {
                    showError();
                }
            }
        }

        function showError() {
            const container = document.getElementById('statusContainer');
            container.classList.add('error');
            document.getElementById('statusTitle').innerHTML =
                '<i class="fas fa-exclamation-triangle me-2"></i>Connection Failed';
            document.getElementById('statusSubtitle').textContent =
                'Unable to connect to the database. Please try again later.';
            document.getElementById('retryCount').textContent =
                'Max retries reached';
        }

        // Start polling after a short delay
        setTimeout(checkDatabase, 2000);
    </script>
</body>

</html>
