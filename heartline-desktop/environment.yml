name: heartline-desktop
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - git
  - pip:
    # GUI Framework (PySide6 recommended for Windows)
    - PySide6==6.4.2
    
    # Material Design Components
    - qt-material==2.14
    - qtawesome==1.3.1
    
    # Database
    - psycopg2-binary==2.9.9
    - SQLAlchemy==2.0.23
    - alembic==1.13.1
    
    # AI/ML for ECG Analysis
    - onnxruntime==1.16.3
    - numpy==1.24.3
    - pandas==2.1.4
    - matplotlib==3.8.2
    - scipy==1.11.4
    
    # Data Validation
    - pydantic==2.5.2
    - pydantic-settings==2.1.0
    - python-dotenv==1.0.0
    
    # PDF Generation
    - reportlab==4.0.8
    
    # Date/Time utilities
    - python-dateutil==2.8.2
    
    # Image Processing
    - Pillow==10.1.0
    
    # Logging
    - loguru==0.7.2
    
    # Configuration
    - dynaconf==3.2.4
    
    # File handling
    - wfdb==4.1.2
